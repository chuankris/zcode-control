    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,#1c3d3d 0,transparent 38%),var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{min-height:100vh;display:grid;grid-template-columns:265px minmax(500px,1fr) 320px}.side,.context{background:#10191f;border-right:1px solid var(--line)}.side{padding:20px 12px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:0 9px}.brandmark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--mint);color:#07241e;font-size:22px;font-weight:900}.brand strong{display:block;font-size:15px}.brand small{display:block;color:var(--muted);margin-top:3px}.outline,.ghost,.primary,.tiny{border:1px solid var(--line);border-radius:10px;color:#eaf0f5;background:#17232a;padding:9px 12px}.outline:hover,.ghost:hover,.tiny:hover{border-color:#4d786d}.primary{background:var(--mint);border-color:var(--mint);color:#082720;font-weight:750}.primary:hover{background:#8bebcc}.wide{width:100%;text-align:left}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#6f8790;font-weight:800;margin:4px 10px 8px}.host{width:100%;border:1px solid transparent;border-radius:11px;color:#dce8ea;background:transparent;padding:10px;text-align:left;display:flex;align-items:center;gap:10px}.host.active{background:#1b3030;border-color:#356257}.host:hover{background:#1b2930}.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none;box-shadow:0 0 0 4px #2a5349}.dot.warn{background:var(--amber);box-shadow:0 0 0 4px #53422a}.host span{flex:1}.host small{display:block;color:var(--muted);margin-top:2px}.count{color:#6f8790}.filter{margin:0 3px;background:#0c151a;border:1px solid var(--line);border-radius:10px;padding:10px;color:#eaf0f5;width:calc(100% - 6px)}.tasklist{overflow:auto;max-height:calc(100vh - 350px)}.taskitem{display:block;width:100%;bord s:12px;padding:13px}.routecard label{display:block;color:#79939c;font-size:11px;margin-bottom:6px}.routecard strong{font-size:13px;word-break:break-word}.routecard small{display:block;color:var(--muted);margin-top:5px}.banner{padding:13px 15px;border-radius:11px;border:1px solid #39545b;background:#172931;color:#c6e2eb;margin:12px 0;line-height:1.55}.banner.warn{background:#372b1d;border-color:#765b35;color:#f8d9a3}.banner.good{background:#173429;border-color:#3e7258;color:#a8edc6}.banner strong{display:block;margin-bottom:2px}.rowtitle{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.rowtitle h2{font-size:14px;margin:0}.rowtitle span{font-size:11px;color:#79909a}.timeline{border-left:1px solid #3a5559;margin-left:9px;padding-left:23px}.event{position:relative;padding:0 0 22px}.event:before{content:"";width:8px;height:8px;border-radius:50%;background:#76cab0;position:absolute;left:-28px;top:5px;border:2px solid #0b1116}.event:nth-child(even):before{background:#78aee8}.eventhead{display:flex;gap:8px;align-items:center;color:#dce9e8;font-size:12px}.eventhead small{margin-left:auto;color:#6f8790}.eventbody{color:#aebfc5;line-height:1.65;margin-top:7px;white-space:pre-wrap}.eventbody.user{color:#e7f2ef;background:#1b3030;border:1px solid #345a52;padding:12px;border-radius:10px}.composer{flex:none;border-top:1px solid var(--line);background:#101a20;padding:17px 24px 19px}.composerinner{max-width:820px;margin:auto}.modebar{display:flex;align-items:center;gap:7px;margin-bottom:9px}.modebar button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:99px;font-size:11px}.modebar button.active{border-color:#45786e;color:#96ebd1;background:#1b3331}.modebar span{margin-left:auto;color:#78909a;font-size:11px}.inputbox{border:1px solid #3a5055;background:#15242a;border-radius:13px;padding:10px}.inputbox:focus-within{border-color:#75caaa}.inputbox textarea{border:0;outline:0;resize:vertical;min-height:62px;max-height:180px;width:100%;background:transparent;color:#eef6f4}.inputfoot{display:flex;justify-content:space-between;align-items:center;color:#758f96;font-size:11px}.context{border-right:0;border-left:1px solid var(--line);padding:24px 18px;overflow:auto;height:100vh}.context h2{font-size:14px;margin:1px 0 14px}.context .block{border:1px solid var(--line);border-radius:12px;background:#142128;padding:15px;margin-bottom:12px}.context label{display:block;color:#75909a;font-size:11px;margin-bottom:6px}.context strong{display:block;word-break:break-word}.context p{color:#a6b8be;font-size:12px;line-height:1.6;margin:7px 0 0}.steps{display:grid;gap:12px}.step{display:flex;gap:9px;font-size:12px;color:#aabdc2}.step b{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#244a3e;color:#a6efd1;font-size:10px;flex:none}.step.pending b{background:#3b3a32;color:#eed19a}.context button{font-size:11px}.simtools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.simtools button{padding:8px 5px}.note{font-size:11px;color:#829aa2;line-height:1.55}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e8f5ed;color:#173429;padding:10px 16px;border-radius:9px;box-shadow:0 12px 40px #0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}.toast.show{opacity:1}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:15;padding:18px}.overlay.show{display:flex}.modal{width:min(520px,100%);background:#16232a;border:1px solid #43605f;border-radius:18px;padding:25px;box-shadow:0 20px 80px #0008}.modal h2{margin:0 0 4px}.modal p{color:var(--muted);font-size:12px;line-height:1.6}.field{margin-top:16px}.field label{display:block;color:#b9cdd0;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{background:#0e191f;color:white;border:1px solid #3b5156;border-radius:9px;width:100%;padding:10px}.field textarea{height:90px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobileframe{max-width:420px;margin:0 auto;background:#101c21;border:7px solid #3f5154;border-radius:32px;padding:18px 13px;box-shadow:0 20px 60px #0007}.mobileframe .content{width:100%}.mobileframe .route{grid-template-columns:1fr}.mobileframe .headline h1{font-size:21px}.mobileframe .routecard{padding:10px}.mobileframe .rowtitle{margin-top:18px}.mobileframe .timeline{padding-left:16px}.mobileframe .event:before{left:-21px}.mobileframe .event{padding-bottom:15px}.mobileframe .banner{font-size:12px}.mobileframe .kicker:before{content:"● 远程手机视图 · ";color:var(--blue)}.hide{display:none!important}@media(max-width:1150px){.shell{grid-template-columns:225px minmax(400px,1fr)}.context{display:none}}@media(max-width:720px){.shell{display:block}.side{height:auto;display:block;padding:12px}.brand{margin-bottom:12px}.side .eyebrow,.side .host,.side .filter,.side .tasklist,.side .foot{display:none}.side .wide{width:auto}.main{height:calc(100vh - 104px)}.topbar{height:auto;padding:11px;display:block}.viewtabs{margin-top:8px;width:max-content}.scroll{padding:18px 12px}.route{grid-template-columns:1fr}.composer{padding:10px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="brandmark">↗</div><div><strong>DSH 连续任务</strong><small>交互原型 · 本机模拟数据</small></div></div>
      <button class="primary wide" id="newTask">＋ 新建任务</button>
      <div><div class="eyebrow">执行节点</div><button class="host active" data-host="all"><i class="dot"></i><span>全部节点<small>本机与现场统一查看</small></span><span class="count">2</span></button><button class="host" data-host="local"><i class="dot"></i><span>本机 ZCode<small>在线 · 3 个工作区</small></span></button><button class="host" data-host="site"><i class="dot warn"></i><span>现场 ZCode<small>在线 · 回显偶有延迟</small></span></button></div>
      <div><div class="eyebrow">任务</div><input class="filter" id="search" placeholder="搜索任务或编号" aria-label="搜索任务"><div class="tasklist" id="taskList"></div></div>
      <div class="foot">此页面只演示交互，不连接真实节点，不会派发指令。</div>
    </aside>
    <main class="main">
      <header class="topbar"><div><strong id="topTitle">任务连续控制</strong><small>同一任务 · 多端查看与续写</small></div><div class="viewtabs"><button class="active" data-view="workbench">工作台</button><button data-view="mobile">手机远程</button><button data-view="codex">Codex 入口</button></div></header>
      <div class="scroll"><div id="renderArea"></div></div>
      <div class="composer"><div class="composerinner"><div class="modebar"><button class="active" data-mode="queue">排队发送</button><button data-mode="steer">立即纠偏</button><span id="modeHint">当前回合结束后送达原任务</span></div><div class="inputbox"><textarea id="message" placeholder="给这个任务补充指令，仍发往同一个 ZCode 桌面任务…"></textarea><div class="inputfoot"><span id="sendHint">原任务 ID 保持不变</span><button class="primary" id="send">发送后续指令 ↗</button></div></div></div></div>
    </main>
    <aside class="context"><h2>任务连接</h2><div id="contextArea"></div><h2>体验状态切换</h2><p class="note">仅用于评审交互；切换不会操作真实 ZCode。</p><div class="simtools"><button class="tiny" data-sim="progress">收到进度</button><button class="tiny" data-sim="done">执行完成</button><button class="tiny" data-sim="lost">回显断开</button><button class="tiny" data-sim="restored">恢复连接</button></div></aside>
  </div>
  <div class="overlay" id="overlay" aria-hidden="true"><div class="modal"><h2>新建连续任务</h2><p>先选执行位置，再交给 ZCode。创建后始终在这条任务上查看和续写。</p><div class="field"><label for="newHost">执行节点</label><select id="newHost"><option value="local">本机 ZCode</option><option value="site">现场 ZCode</option></select></div><div class="field"><label for="newWorkspace">项目工作区</label><select id="newWorkspace"></select></div><div class="field"><label for="newTitle">任务标题</label><input id="newTitle" placeholder="例如：检查启动失败原因"></div><div class="field"><label for="newPrompt">任务描述</label><textarea id="newPrompt" placeholder="描述期望结果和验收条件"></textarea></div><div class="modalfoot"><button class="outline" id="cancelNew">取消</button><button class="primary" id="createNew">创建并模拟派发</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const now=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    const tasks=[
      {id:'WB-0929-003',desktop:'sess_a91f…',title:'检查工作台的任务连续体验',host:'local',workspace:'deephik-progo',status:'running',origin:'Codex',events:[['Codex','请检查工作台的任务连续体验，并告诉我哪里不顺。','09:36','user'],['工作台','已绑定本机 ZCode / deephik-progo，原桌面任务 sess_a91f…','09:36'],['ZCode','已开始检查任务入口和状态回显；正在整理问题。','09:37']]},
      {id:'WB-0929-002',desktop:'sess_6502…',title:'模拟今天的现场告警',host:'site',workspace:'海信项目',status:'uncertain',origin:'工作台',events:[['工作台','后续指令已经提交，桌面回执尚未确认。','09:14'],['系统','为避免重复执行，已暂时锁定再次发送。请先查看现场桌面任务。','09:15']]},
      {id:'WB-0929-001',desktop:'sess_03d5…',title:'复核任务列表与工作区',host:'local',workspace:'本地工作台',status:'done',origin:'工作台',events:[['工作台','已创建原桌面任务。','08:42'],['ZCode','已完成工作区与任务列表的复核。','08:48']]}
    ];
    const state={selected:tasks[0].id,host:'all',view:'workbench',mode:'queue'};
    const statusText={running:'执行中',uncertain:'结果待核实',done:'已完成',queued:'等待执行'};
    const workspaces={local:['deephik-progo','本地工作台','test-workspace'],site:['海信项目','应急指挥','现场测试区']};
    function task(){return tasks.find(t=>t.id===state.selected)||tasks[0]}
    function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
    function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
    function renderList(){const q=$('#search').value.trim().toLowerCase(),box=$('#taskList');box.replaceChildren();tasks.filter(t=>(state.host==='all'||t.host===state.host)&&(!q||(t.title+t.id+t.workspace).toLowerCase().includes(q))).forEach(t=>{const b=el('button','taskitem'+(t.id===state.selected?' active':''));b.append(el('strong','',t.title),el('small','',`${t.host==='local'?'本机':'现场'} / ${t.workspace} · ${statusText[t.status]}`),el('div','id',t.id));b.onclick=()=>{state.selected=t.id;render()};box.append(b)});if(!box.children.length)box.append(el('p','note','这里没有匹配的任务。'))}
    function buildContent(t){const content=el('div','content');const kicker=el('div','kicker',state.view==='codex'?'CODEX 发起 · 同步到工作台':'ORIGINAL TASK · SINGLE THREAD');content.append(kicker);const h=el('div','headline'),left=el('div');left.append(el('h1','',t.title),el('div','subline',`${t.id} · 原桌面任务 ${t.desktop} · 来源 ${t.origin}`));h.append(left,el('span','badge '+(t.status==='uncertain'?'amber':t.status==='done'?'blue':''),statusText[t.status]));content.append(h);
      const route=el('div','route');[['执行节点',t.host==='local'?'本机 ZCode':'现场 ZCode','固定在原任务'],['工作区',t.workspace,'创建后不可改'],['桌面任务',t.desktop,'续写不新建任务']].forEach(([l,v,s])=>{const c=el('div','routecard');c.append(el('label','',l),el('strong','',v),el('small','',s));route.append(c)});content.append(route);
      const banner=el('div','banner '+(t.status==='uncertain'?'warn':t.status==='done'?'good':''));banner.append(el('strong','',t.status==='uncertain'?'回显断开，执行结果未知':t.status==='done'?'已完成，可以在原任务继续提问':t.status==='queued'?'任务已记录，等待节点接收':'任务正在原 ZCode 会话中执行'),el('span','',t.status==='uncertain'?'我们不会自动重发这条指令。先到 ZCode 桌面核实，再决定是否继续。':t.status==='done'?'下方发送会追加到同一桌面任务，不会创建一条同名新任务。':t.status==='queued'?'派发与实际执行会分别确认，不把“已提交”当作“已执行”。':'进度会持续回到这条任务；可排队下一条指令，或对当前回合立即纠偏。'));content.append(banner);
      const rt=el('div','rowtitle');rt.append(el('h2','','任务对话'),el('span','',`${t.events.length} 条事件 · 单一时间线`));content.append(rt);const timeline=el('div','timeline');t.events.forEach(([who,text,time,kind])=>{const event=el('div','event'),head=el('div','eventhead');head.append(el('strong','',who),el('small','',time));event.append(head,el('div','eventbody'+(kind==='user'?' user':''),text));timeline.append(event)});content.append(timeline);return content}
    function renderContext(t){const area=$('#contextArea');area.replaceChildren();const b=el('div','block');b.append(el('label','','稳定身份'),el('strong','',t.id),el('p','','关联同一个 ZCode 桌面任务：'+t.desktop));area.append(b);const c=el('div','block'),steps=el('div','steps');[['1','Codex / 工作台登记',true],['2','执行位置绑定',true],['3','ZCode 接收与执行',t.status!=='queued'],['4','结果回传与可续写',t.status==='done']].forEach(([n,text,done])=>{const row=el('div','step'+(done?'':' pending'));row.append(el('b','',n),el('span','',text));steps.append(row)});c.append(steps);area.append(c);const d=el('div','block');d.append(el('label','','当前操作规则'),el('strong','',t.status==='uncertain'?'停止自动重试':'续写原任务'),el('p','',t.status==='uncertain'?'回执缺失不等于执行失败。先核实现场桌面，再解除锁定。':'排队指令与立即纠偏都沿用原任务标识。'));area.append(d)}
    function render(){const t=task();renderList();$$('[data-host]').forEach(e=>e.classList.toggle('active',e.dataset.host===state.host));$$('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===state.view));$$('[data-mode]').forEach(e=>e.classList.toggle('active',e.dataset.mode===state.mode));const area=$('#renderArea');area.replaceChildren();const c=buildContent(t);if(state.view==='mobile'){const phone=el('div','mobileframe');phone.append(c);area.append(phone)}else area.append(c);$('#topTitle').textContent=state.view==='mobile'?'手机远程 · 同一任务':state.view==='codex'?'Codex 指令入口':'任务连续控制';$('#modeHint').textContent=state.mode==='queue'?'当前回合结束后送达原任务':'尝试立即纠偏当前回合';$('#sendHint').textContent=t.status==='uncertain'?'结果未知：发送已锁定':`续写 ${t.desktop} · 不新建任务`;$('#send').disabled=t.status==='uncertain'||t.status==='queued';renderContext(t)}
    function populateWorkspaces(){const box=$('#newWorkspace');box.replaceChildren();workspaces[$('#newHost').value].forEach(w=>{const o=el('option','',w);o.value=w;box.append(o)})}
    function closeModal(){$('#overlay').classList.remove('show');$('#overlay').setAttribute('aria-hidden','true')}
    $('#newTask').onclick=()=>{$('#overlay').classList.add('show');$('#overlay').setAttribute('aria-hidden','false');populateWorkspaces();$('#newTitle').focus()};$('#cancelNew').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeModal()};$('#newHost').onchange=populateWorkspaces;
    $('#createNew').onclick=()=>{const title=$('#newTitle').value.trim(),prompt=$('#newPrompt').value.trim();if(!title||!prompt){toast('请填写标题和任务描述');return}const host=$('#newHost').value,id='WB-0929-'+String(tasks.length+1).padStart(3,'0');tasks.unshift({id,desktop:'sess_new…',title,host,workspace:$('#newWorkspace').value,status:'queued',origin:'工作台',events:[['工作台',prompt,now(),'user'],['工作台','已登记任务；正在等待节点确认，尚不能判定桌面已执行。',now()]]});state.selected=id;state.host='all';closeModal();$('#newTitle').value='';$('#newPrompt').value='';render();toast('已创建模拟任务；没有连接真实 ZCode');setTimeout(()=>{const t=tasks.find(x=>x.id===id);if(t&&t.status==='queued'){t.status='running';t.events.push(['ZCode','模拟节点已确认接收，开始执行。',now()]);render()}},1800)};
    $('#send').onclick=()=>{const t=task(),msg=$('#message').value.trim();if(!msg){toast('先写一条后续指令');return}if(t.status==='uncertain'){toast('回显结果未知，先核实原桌面任务');return}t.events.push(['你 · '+(state.mode==='queue'?'排队':'立即纠偏'),msg,now(),'user']);t.events.push(['工作台',state.mode==='queue'?'已排入原任务下一回合，等待当前回合结束。':'已向原任务发送纠偏请求，等待桌面确认。',now()]);$('#message').value='';t.status='running';render();toast('已模拟发送；原桌面任务 ID 未改变')};
    $$('[data-host]').forEach(b=>b.onclick=()=>{state.host=b.dataset.host;render()});$$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});$$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()});$('#search').oninput=renderList;
    $$('[data-sim]').forEach(b=>b.onclick=()=>{const t=task(),s=b.dataset.sim;if(s==='progress'){t.status='running';t.events.push(['ZCode','新增一条实时进度：正在运行检查与验证。',now()])}if(s==='done'){t.status='done';t.events.push(['ZCode','任务完成。结果、文件改动和测试记录已回传。',now()])}if(s==='lost'){t.status='uncertain';t.events.push(['系统','连接中断；缺少桌面确认，当前结果未知。已阻止重复派发。',now()])}if(s==='restored'){t.status='running';t.events.push(['系统','模拟重新连接成功，已从原任务恢复事件流。',now()])}render();toast('已切换模拟状态')});
    render();
  </script>
</body>
</html>
